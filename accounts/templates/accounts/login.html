<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - LearnHub</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(to right,#2563eb,#7c3aed);
        }

        .container{
            width:400px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 5px 20px rgba(0,0,0,0.2);
        }

        .title{
            text-align:center;
            margin-bottom:30px;
        }

        .title h1{
            color:#111827;
            margin-bottom:10px;
        }

        .title p{
            color:#6b7280;
        }

        .input-box{
            margin-bottom:20px;
        }

        .input-box input{
            width:100%;

            padding:14px;

            border:1px solid #d1d5db;

            border-radius:10px;

            outline:none;

            font-size:15px;
        }

        .input-box input:focus{
            border-color:#2563eb;
        }

        .login-btn{
            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .login-btn:hover{
            background:#1d4ed8;
        }

        .bottom-text{
            text-align:center;

            margin-top:20px;

            color:#6b7280;
        }

        .bottom-text a{
            text-decoration:none;

            color:#2563eb;

            font-weight:600;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">

            <h1>

                Welcome Back

            </h1>

            <p>

                Login to continue learning

            </p>

        </div>

        <form>

            <div class="input-box">

                <input type="text" placeholder="Username or Email">

            </div>

            <div class="input-box">

                <input type="password" placeholder="Password">

            </div>

            <a href="/dashboard/">

                <button type="button" class="login-btn">

                    Login

                </button>

            </a>

        </form>

        <div class="bottom-text">

            New to LearnHub ?

            <a href="/signup/">

                Create Account

            </a>

        </div>

    </div>

</body>

</html>
