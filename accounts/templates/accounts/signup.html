<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account - LearnHub</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Poppins',sans-serif;
        }

        body{
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(to right,#2563eb,#7c3aed);

            padding:40px 0;
        }

        .container{
            width:450px;

            background:white;

            padding:40px;

            border-radius:20px;

            box-shadow:0 5px 20px rgba(0,0,0,0.2);
        }

        .title{
            text-align:center;

            margin-bottom:30px;
        }

        .title h1{
            color:#111827;

            margin-bottom:10px;
        }

        .title p{
            color:#6b7280;
        }

        .input-box{
            margin-bottom:18px;
        }

        .input-box input{
            width:100%;

            padding:14px;

            border:1px solid #d1d5db;

            border-radius:10px;

            outline:none;

            font-size:15px;
        }

        .input-box input:focus{
            border-color:#2563eb;
        }

        .signup-btn{
            width:100%;

            padding:14px;

            border:none;

            border-radius:10px;

            background:#2563eb;

            color:white;

            font-size:16px;

            cursor:pointer;

            transition:0.3s;
        }

        .signup-btn:hover{
            background:#1d4ed8;
        }

        .bottom-text{
            text-align:center;

            margin-top:20px;

            color:#6b7280;
        }

        .bottom-text a{
            text-decoration:none;

            color:#2563eb;

            font-weight:600;
        }

        .terms{
            display:flex;
            align-items:center;

            gap:10px;

            margin-bottom:20px;

            font-size:14px;

            color:#374151;
        }

        .show-btn{
            margin-top:10px;

            padding:10px 18px;

            border:none;

            border-radius:8px;

            background:#7c3aed;

            color:white;

            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="container">

        <div class="title">

            <h1>

                Create Account

            </h1>

            <p>

                Join LearnHub and start learning today

            </p>

        </div>

        <form>

            <div class="input-box">

                <input type="email" placeholder="Email Address">

            </div>

            <div class="input-box">

                <input type="text" placeholder="First Name">

            </div>

            <div class="input-box">

                <input type="text" placeholder="Last Name">

            </div>

            <div class="input-box">

                <input type="password" placeholder="Create Password" id="password">

            </div>

            <div class="input-box">

                <input type="password" placeholder="Confirm Password">

            </div>

            <button type="button" class="show-btn" onclick="showPassword()">

                Show Password

            </button>

            <div class="terms">

                <input type="checkbox">

                <label>

                    I agree to the Terms & Conditions

                </label>

            </div>

            <a href="/login/">

                <button type="button" class="signup-btn">

                    Create Account

                </button>

            </a>

        </form>

        <div class="bottom-text">

            Already have an account ?

            <a href="/login/">

                Login

            </a>

        </div>

    </div>

    <script>

        function showPassword(){

            var x = document.getElementById("password");

            if(x.type === "password"){

                x.type = "text";

            }

            else{

                x.type = "password";

            }

        }

    </script>

</body>

</html>
