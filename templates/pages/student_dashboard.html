{% extends 'base.html' %}
{% block title %}Student Dashboard | LearnHub{% endblock %}
{% block content %}
<section class="dashboard-shell">
    <div class="container">
        <div class="dashboard-header" data-aos="fade-up"><div><span class="eyebrow">Dashboard</span><h1>Welcome back, learner</h1></div><a class="btn btn-primary-gradient" href="{% url 'courses' %}">Continue Learning</a></div>
        <div class="row g-4">
            <div class="col-md-4"><div class="metric-card"><i class="fa-solid fa-book-open"></i><strong>6</strong><span>Active courses</span></div></div>
            <div class="col-md-4"><div class="metric-card"><i class="fa-solid fa-fire"></i><strong>18</strong><span>Day streak</span></div></div>
            <div class="col-md-4"><div class="metric-card"><i class="fa-solid fa-award"></i><strong>3</strong><span>Certificates</span></div></div>
        </div>
        <div class="content-panel mt-4" data-aos="fade-up"><h2>Current course</h2><div class="progress-item"><div><strong>Python for Everyone</strong><span>Module 4 of 8 complete</span></div><div class="progress"><div class="progress-bar" style="width: 58%"></div></div></div></div>
    </div>
</section>
{% endblock %}
