{% extends 'base.html' %}
{% block title %}Forgot Password | LearnHub{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="auth-card compact-auth" data-aos="fade-up"><div class="auth-form-wrap"><h1>Forgot Password</h1><p>Enter your email and we will send a reset link.</p><form class="needs-validation auth-form" novalidate method="post">{% csrf_token %}<div class="input-icon"><i class="fa-solid fa-envelope"></i><input class="form-control" type="email" name="email" placeholder="Email address" required><div class="invalid-feedback">Enter a valid email.</div></div><button class="btn btn-primary-gradient w-100" type="submit">Send Reset Link</button><p class="auth-switch"><a href="{% url 'login' %}">Back to login</a></p></form></div></div></div></section>
{% endblock %}
