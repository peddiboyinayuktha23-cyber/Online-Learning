{% extends 'base.html' %}
{% block title %}Reset Password | LearnHub{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="auth-card compact-auth" data-aos="fade-up"><div class="auth-form-wrap"><h1>Reset Password</h1><p>Choose a strong new password.</p><form class="needs-validation auth-form" novalidate method="post">{% csrf_token %}<div class="input-icon"><i class="fa-solid fa-lock"></i><input class="form-control password-field strength-input" type="password" placeholder="New password" required minlength="8"><button class="password-toggle" type="button" aria-label="Show password"><i class="fa-regular fa-eye"></i></button><div class="invalid-feedback">Use at least 8 characters.</div></div><div class="password-meter"><span></span><small>Password strength</small></div><div class="input-icon"><i class="fa-solid fa-lock"></i><input class="form-control password-field" type="password" placeholder="Confirm new password" required minlength="8"><button class="password-toggle" type="button" aria-label="Show password"><i class="fa-regular fa-eye"></i></button><div class="invalid-feedback">Confirm your password.</div></div><button class="btn btn-primary-gradient w-100" type="submit">Reset Password</button></form></div></div></div></section>
{% endblock %}
