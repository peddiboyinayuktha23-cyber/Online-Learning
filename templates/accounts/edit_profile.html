{% extends 'base.html' %}
{% block title %}Edit Profile | LearnHub{% endblock %}
{% block content %}
<section class="section-pad"><div class="container"><form class="content-panel needs-validation profile-form" novalidate method="post" enctype="multipart/form-data">{% csrf_token %}<div class="section-heading"><div><span class="eyebrow">Profile</span><h1>Edit profile</h1></div><button class="btn btn-primary-gradient" type="submit">Save Changes</button></div><div class="row g-3"><div class="col-md-6"><label class="form-label">Full name</label><input class="form-control" name="full_name" value="{{ request.user.full_name }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" type="email" name="email" value="{{ request.user.email }}" required></div><div class="col-md-6"><label class="form-label">Phone number</label><input class="form-control" name="phone_number" value="{{ request.user.phone_number }}"></div><div class="col-md-6"><label class="form-label">Profile image</label><input class="form-control" type="file" name="profile_image" accept="image/*"></div><div class="col-12"><label class="form-label">Bio</label><textarea class="form-control" name="bio" rows="4" placeholder="Tell instructors what you are learning">{{ request.user.bio }}</textarea></div></div></form></div></section>
{% endblock %}
