{% extends 'base.html' %}
{% block title %}Change Password | LearnHub{% endblock %}
{% block content %}
<section class="auth-section"><div class="container"><div class="auth-card compact-auth" data-aos="fade-up"><div class="auth-form-wrap"><h1>Change Password</h1><p>Keep your account secure with a strong password.</p><form class="needs-validation auth-form" novalidate method="post">{% csrf_token %}<div class="input-icon"><i class="fa-solid fa-lock"></i><input class="form-control password-field" type="password" name="current_password" placeholder="Current password" required><button class="password-toggle" type="button" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><div class="input-icon"><i class="fa-solid fa-lock"></i><input class="form-control password-field strength-input" type="password" name="new_password" placeholder="New password" required minlength="8"><button class="password-toggle" type="button" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><div class="password-meter"><span></span><small>Password strength</small></div><div class="input-icon"><i class="fa-solid fa-lock"></i><input class="form-control password-field" type="password" name="confirm_password" placeholder="Confirm new password" required minlength="8"><button class="password-toggle" type="button" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div><button class="btn btn-primary-gradient w-100" type="submit">Update Password</button></form></div></div></div></section>
{% endblock %}
