{% extends 'base.html' %}
{% block title %}{{ quiz.title }} | Online Learning Portal{% endblock %}
{% block content %}
<section class="page-hero compact"><div class="container"><h1>{{ quiz.title }}</h1><p>{{ quiz.timer_minutes }} minute timer</p></div></section>
<section class="section-pad"><div class="container content-panel">
    <form method="post">{% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary-gradient" type="submit">Submit Quiz</button>
    </form>
</div></section>
{% endblock %}
